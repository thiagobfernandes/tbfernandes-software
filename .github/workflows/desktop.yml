# Windows app (docs/desktop.md): builds the NSIS installer and keeps it as a run artifact.
name: desktop

on:
  pull_request:
    paths:
      - "tbfernandes-desktop/**"
      - "tbfernandes-backend/src/main/**"
      - "tbfernandes-backend/pom.xml"
      - "tbfernandes-frontend/src/**"
      - "tbfernandes-frontend/public/**"
      - "tbfernandes-frontend/package*.json"
      - "tbfernandes-frontend/next.config.ts"
      - ".github/workflows/desktop.yml"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            tbfernandes-frontend/package-lock.json
            tbfernandes-desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tbfernandes-desktop/src-tauri

      - name: Frontend (static export)
        working-directory: tbfernandes-frontend
        run: npm ci && npm run build:desktop

      - name: Java runtime, backend and PostgreSQL
        run: tbfernandes-desktop/scripts/prepare-resources.sh

      - name: Installer
        working-directory: tbfernandes-desktop
        run: npm ci && npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: TBFernandes-setup
          path: tbfernandes-desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

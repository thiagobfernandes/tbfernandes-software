# PLT-06: build and test both apps on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tbfernandes-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tbfernandes-backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Testcontainers uses the Docker engine that GitHub-hosted runners already have.
      - run: npm run test:e2e
      - run: npm run build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tbfernandes-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tbfernandes-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run build:desktop

  # The images of compose.yaml, started together: catches a broken Dockerfile or compose setting.
  images:
    runs-on: ubuntu-latest
    env:
      TBF_PGDATA_VOLUME: tbf-ci-pgdata
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 180
      - name: Smoke test through nginx
        run: |
          curl -fsS http://localhost/api/v1/tasks | head -c 300; echo
          curl -fsS -o /dev/null -w '%{http_code}\n' http://localhost/
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v

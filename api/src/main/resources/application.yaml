spring:
  application:
    name: tbfernandes-api
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration
  jackson:
    mapper:
      accept-case-insensitive-enums: true
    deserialization:
      # Missing booleans in a request (e.g. milestone "done") mean false, as in the frontend.
      fail-on-null-for-primitives: false
    datatype:
      enum:
        write-enums-to-lowercase: true
  docker:
    compose:
      lifecycle-management: start-only
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false
      republish-outstanding-events-on-restart: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith

springdoc:
  swagger-ui:
    path: /swagger-ui.html

server:
  servlet:
    session:
      timeout: 7d
      cookie:
        http-only: true
        same-site: lax
        secure: ${TBF_COOKIE_SECURE:false}

tbf:
  time-zone: America/Sao_Paulo
  auth:
    # single-user: no login, every request acts as owner-id (local development).
    # session: login required (any shared environment; the prod profile forces it).
    mode: ${TBF_AUTH_MODE:single-user}
    # Matches the owner seeded in db/dev.
    owner-id: 0192f000-0000-7000-8000-000000000001
    bootstrap:
      email: ${TBF_AUTH_BOOTSTRAP_EMAIL:}
      password: ${TBF_AUTH_BOOTSTRAP_PASSWORD:}
      name: ${TBF_AUTH_BOOTSTRAP_NAME:}
  cors:
    allowed-origins: ${TBF_CORS_ORIGINS:http://localhost:3000}
  pluggy:
    enabled: ${PLUGGY_ENABLED:false}
    base-url: https://api.pluggy.ai
    client-id: ${PLUGGY_CLIENT_ID:}
    client-secret: ${PLUGGY_CLIENT_SECRET:}

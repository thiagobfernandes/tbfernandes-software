# Local database. `./mvnw spring-boot:run` starts it automatically (spring-boot-docker-compose);
# to run it on its own: `docker compose up -d`.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tbfernandes
      POSTGRES_USER: tbf
      POSTGRES_PASSWORD: tbf
    ports:
      - "5432:5432"
    volumes:
      - tbf-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tbf -d tbfernandes"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tbf-pgdata:

# The whole platform behind nginx: `docker compose up -d --build`, then http://localhost.
# Only the database, for `npm run dev` in tbfernandes-backend/: `docker compose up -d postgres`.
# Ollama (free local embeddings for the assistant) is in the "ai" profile:
# `docker compose --profile ai up -d --build`, or COMPOSE_PROFILES=ai in .env.
# Settings come from .env (see .env.example). How to run and deploy: docs/como-rodar.md.
name: tbfernandes

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tbfernandes
      POSTGRES_USER: tbf
      POSTGRES_PASSWORD: ${TBF_DB_PASSWORD:-tbf}
    ports:
      # Local only. 5432 is often taken by other projects on this machine.
      - "127.0.0.1:${TBF_DB_PORT:-5434}:5432"
    volumes:
      - tbf-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tbf -d tbfernandes"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./tbfernandes-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TBF_PROFILE: ${TBF_PROFILE:-dev}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: tbf
      DB_PASSWORD: ${TBF_DB_PASSWORD:-tbf}
      DB_NAME: tbfernandes
      # Behind nginx: trust X-Forwarded-* for the client address and HTTPS cookies.
      TBF_TRUST_PROXY: "true"
      TBF_AUTH_MODE: ${TBF_AUTH_MODE:-single-user}
      TBF_AUTH_BOOTSTRAP_EMAIL: ${TBF_AUTH_BOOTSTRAP_EMAIL:-}
      TBF_AUTH_BOOTSTRAP_PASSWORD: ${TBF_AUTH_BOOTSTRAP_PASSWORD:-}
      TBF_AUTH_BOOTSTRAP_NAME: ${TBF_AUTH_BOOTSTRAP_NAME:-}
      # Empty: a new secret on each start, which signs everyone out on restart.
      TBF_SESSION_SECRET: ${TBF_SESSION_SECRET:-}
      TBF_COOKIE_SECURE: ${TBF_COOKIE_SECURE:-false}
      # Empty names and URLs take the provider's default (src/infrastructure/environments).
      TBF_ASSISTANT_MODEL: ${TBF_ASSISTANT_MODEL:-none}
      TBF_ASSISTANT_MODEL_NAME: ${TBF_ASSISTANT_MODEL_NAME:-}
      TBF_ASSISTANT_MODEL_BASE_URL: ${TBF_ASSISTANT_MODEL_BASE_URL:-}
      TBF_ASSISTANT_MODEL_API_KEY: ${TBF_ASSISTANT_MODEL_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TBF_ASSISTANT_EMBEDDING: ${TBF_ASSISTANT_EMBEDDING:-none}
      TBF_ASSISTANT_EMBEDDING_NAME: ${TBF_ASSISTANT_EMBEDDING_NAME:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      OLLAMA_BASE_URL: http://ollama:11434
      TBF_ASSISTANT_TRACING: ${TBF_ASSISTANT_TRACING:-none}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
      PLUGGY_ENABLED: ${PLUGGY_ENABLED:-false}
      PLUGGY_CLIENT_ID: ${PLUGGY_CLIENT_ID:-}
      PLUGGY_CLIENT_SECRET: ${PLUGGY_CLIENT_SECRET:-}
      PLUGGY_WEBHOOK_SECRET: ${PLUGGY_WEBHOOK_SECRET:-}
    healthcheck:
      # 127.0.0.1, not localhost: in Alpine localhost is ::1 and the API listens on IPv4.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  # Embeddings for the assistant, free and on this machine. Only with the "ai" profile.
  ollama:
    image: ollama/ollama:0.12.6
    profiles: [ai]
    restart: unless-stopped
    ports:
      # Local only, for `npm run dev`. Change it if Ollama is also installed on the host.
      - "127.0.0.1:${TBF_OLLAMA_PORT:-11434}:11434"
    volumes:
      - tbf-ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 6

  # Downloads the embedding model once (it stays in the volume) and exits.
  ollama-models:
    image: ollama/ollama:0.12.6
    profiles: [ai]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${TBF_ASSISTANT_EMBEDDING_NAME:-bge-m3}"]
    restart: "no"

  frontend:
    build:
      context: ./tbfernandes-frontend
      args:
        # Empty on purpose: the browser calls /api on the same origin, through nginx.
        NEXT_PUBLIC_API_URL: ""
        NEXT_PUBLIC_DATA_SOURCE: ${NEXT_PUBLIC_DATA_SOURCE:-api}
        NEXT_PUBLIC_PLUGGY_SANDBOX: ${NEXT_PUBLIC_PLUGGY_SANDBOX:-false}
    restart: unless-stopped

  nginx:
    build: ./tbfernandes-nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "${TBF_HTTP_PORT:-80}:80"

volumes:
  tbf-ollama:
  tbf-pgdata:
    # The name it got when the database lived in api/compose.yaml. It holds real data: keep it.
    name: ${TBF_PGDATA_VOLUME:-api_tbf-pgdata}

# Single entry point: / goes to the frontend and /api to the backend, on the same origin.
server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    # Docker's DNS, resolved per request so a recreated container is found again.
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:8080;
    set $frontend http://frontend:3000;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    location /api/ {
        # Assistant questions wait for the AI provider.
        proxy_read_timeout 120s;
        proxy_pass $backend;
    }

    location / {
        proxy_pass $frontend;
    }
}
